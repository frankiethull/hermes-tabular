[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tabular"
version = "0.1.1"
description = "An opinionated pack of Hermes skills for tabular intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "frank hull, hermes-tabular contributors" }]
keywords = ["hermes", "skills", "tabular", "machine-learning", "catboost", "tabicl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "pyarrow>=14.0",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
tabicl = ["tabicl>=2.0", "torch>=2.2"]
uncertainty = ["mapie>=0.8"]
plots = ["matplotlib>=3.8"]
all = [
  "catboost>=1.2",
  "tabicl>=2.0",
  "torch>=2.2",
  "mapie>=0.8",
  "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/frankiethull/hermes-tabular"
Issues = "https://github.com/frankiethull/hermes-tabular/issues"

[project.scripts]
hermes-tabular-skills = "scripts.install_skills:main"

[tool.setuptools]
packages = []

[tool.setuptools.data-files]
"share/hermes-tabular" = ["README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
